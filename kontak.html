<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kontak & Alamat | PT Diesel Agri Sukses Sejahtera Jakarta</title>
  <meta name="description" content="Hubungi PT Diesel Agri Sukses Sejahtera di Jakarta Timur untuk konsultasi traktor, mesin pertanian, dan drone penyemprot. Telepon 0817-6602-023.">

  <link rel="icon" href="assets/images/logo/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
    <!-- Data terstruktur untuk Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "PT Diesel Agri Sukses Sejahtera",
    "image": "https://dass.co.id/assets/images/logo/logo.png",
    "url": "https://dass.co.id",
    "telephone": "+62-817-6602-023",
    "email": "info@dieselagriss.com",
    "priceRange": "$$$",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Jalan River Garden Boulevard No. 18B Blok B2, RW. 7, Cakung Timur, Kec. Cakung",
      "addressLocality": "Jakarta Timur",
      "addressRegion": "DKI Jakarta",
      "postalCode": "13910",
      "addressCountry": "ID"
    },
    "openingHoursSpecification": {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
      "opens": "08:00",
      "closes": "17:00"
    }
  }
  </script>
</head>
<body data-base="" data-page="kontak">

  <div id="site-header"></div>

  <main>

    <!-- ===== HERO ===== -->
    <section class="brand-hero">
      <div class="container brand-hero__grid brand-hero__grid--satu">
        <div class="brand-hero__left">
          <span class="brand-hero__eyebrow" data-i18n="kontak.eyebrow">Hubungi Kami</span>
          <h1 data-i18n="kontak.judul">Sampaikan Kebutuhan Anda</h1>
          <p data-i18n="kontak.desc">
            Tim kami siap membantu dari pemilihan spesifikasi unit, penawaran harga,
            hingga dukungan purna jual.
          </p>
        </div>
      </div>
    </section>

    <!-- ===== KONTAK & FORM ===== -->
    <section class="section">
      <div class="container">
        <div class="kontak-grid">

          <!-- Kiri: info -->
          <div class="kontak-info">

            <div class="kontak-item">
              <div class="kontak-item__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
              </div>
              <div>
                <h3 data-i18n="kontak.alamat">Alamat Kantor</h3>
                <p data-company="alamat"></p>
              </div>
            </div>

            <div class="kontak-item">
              <div class="kontak-item__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/>
                </svg>
              </div>
              <div>
                <h3 data-i18n="kontak.telepon">Telepon</h3>
                <p><a href="#" data-company="telepon-link"><span data-company="telepon"></span></a></p>
              </div>
            </div>

            <div class="kontak-item">
              <div class="kontak-item__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <path d="M22 6l-10 7L2 6"/>
                </svg>
              </div>
              <div>
                <h3 data-i18n="kontak.email">Email</h3>
                <p><a href="#" data-company="email-link"><span data-company="email"></span></a></p>
              </div>
            </div>

            <div class="kontak-item">
              <div class="kontak-item__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
                </svg>
              </div>
              <div>
                <h3 data-i18n="kontak.jam">Jam Operasional</h3>
                <p data-company="jam"></p>
              </div>
            </div>

          </div>

          <!-- Kanan: form -->
          <div class="kontak-form">
            <h3 data-i18n="kontak.formJudul">Kirim Pesan</h3>
            <p class="kontak-form__note" data-i18n="kontak.formNote">
              Isi keterangan di bawah, lalu pesan akan diteruskan ke WhatsApp kami.
            </p>

            <div class="form-group">
              <label for="fNama" data-i18n="form.nama">Nama Lengkap</label>
              <input type="text" id="fNama" placeholder="Nama Anda">
            </div>

            <div class="form-group">
              <label for="fPerusahaan" data-i18n="form.perusahaan">Perusahaan / Instansi</label>
              <input type="text" id="fPerusahaan" placeholder="Opsional">
            </div>

            <div class="form-group">
              <label for="fMinat" data-i18n="form.minat">Produk yang Diminati</label>
              <select id="fMinat">
                <option value="">— Pilih —</option>
                <option value="Zoomlion">Zoomlion</option>
                <option value="EAVision">EAVision</option>
                <option value="VectorAgr">VectorAgr</option>
                <option value="Sparepart">Sparepart</option>
                <option value="Layanan Servis">Layanan Servis</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fPesan" data-i18n="form.pesan">Pesan</label>
              <textarea id="fPesan" rows="4" placeholder="Sampaikan kebutuhan Anda"></textarea>
            </div>

            <button class="btn btn--wa btn--lg btn--block" id="btnKirimWA" data-i18n="form.kirim">
              Kirim via WhatsApp
            </button>
          </div>

        </div>
      </div>
    </section>

    <!-- ===== PETA ===== -->
    <section class="section section--sm section--soft">
      <div class="container">
        <div class="section-header section-header--center">
          <span class="section-header__eyebrow" data-i18n="kontak.petaEyebrow">Lokasi</span>
          <h2 class="section-header__title" data-i18n="kontak.petaJudul">Kantor Pusat Kami</h2>
        </div>
        <div class="kontak-peta">
          <iframe
            src="https://www.google.com/maps?q=Jalan+River+Garden+Boulevard+Cakung+Timur+Jakarta+Timur&output=embed"
            width="100%" height="420" style="border:0;"
            allowfullscreen="" loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            title="Lokasi kantor"></iframe>
        </div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data/produk-vectoragr.js"></script>
  <script src="assets/js/data/lang.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/slider.js"></script>
  <script src="assets/js/filter-produk.js"></script>
  <script src="assets/js/form-kontak.js"></script>
  <script src="assets/js/main.js"></script>
</body>
